server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker may assign a new IP when the API container is recreated. Resolve
    # the service name at request time instead of keeping a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $loyaltyos_api_upstream http://api:3002;
        proxy_pass $loyaltyos_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        set $loyaltyos_api_upstream http://api:3002;
        proxy_pass $loyaltyos_api_upstream;
    }

    location ^~ /customer/assets/ {
        rewrite ^/customer/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /customer {
        return 301 /customer/;
    }

    location ^~ /customer/ {
        rewrite ^/customer/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
