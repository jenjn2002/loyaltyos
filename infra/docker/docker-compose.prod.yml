services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loyaltyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loyaltyos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loyaltyos} -d ${POSTGRES_DB:-loyaltyos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    expose:
      - "3002"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT_API: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-loyaltyos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loyaltyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      PORTAL_URL: ${PORTAL_URL:-http://localhost/customer}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5175}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL}
      ADMIN_DEFAULT_NAME: ${ADMIN_DEFAULT_NAME}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_SALT: ${API_KEY_SALT}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      GIFTCARD_HMAC_SECRET: ${GIFTCARD_HMAC_SECRET}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@loyaltyos.dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:-}
      APPRECIO_API_BASE: ${APPRECIO_API_BASE:-https://apiv2.dcanje.mx/api}
      APPRECIO_PUBLIC_TOKEN: ${APPRECIO_PUBLIC_TOKEN:-}
      APPRECIO_PRIVATE_TOKEN: ${APPRECIO_PRIVATE_TOKEN:-}
      APPRECIO_IDENTIFIER_TYPE: ${APPRECIO_IDENTIFIER_TYPE:-email}
      APPRECIO_TIMEOUT_MS: ${APPRECIO_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_BASE_PATH: ${ADMIN_BASE_PATH:-/admin/}
    expose:
      - "80"
    networks:
      - default
      - traefik-hrm
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-hrm
      - traefik.http.routers.loyalty-admin.rule=Host(`adminloyalty.trunglocxoay.store`)
      - traefik.http.routers.loyalty-admin.entrypoints=websecure
      - traefik.http.routers.loyalty-admin.tls=true
      - traefik.http.routers.loyalty-admin.tls.certresolver=le
      - traefik.http.routers.loyalty-admin.middlewares=loyalty-admin-headers@docker
      - traefik.http.middlewares.loyalty-admin-headers.headers.stsSeconds=315360000
      - traefik.http.middlewares.loyalty-admin-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.loyalty-admin-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.loyalty-admin-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.loyalty-admin-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.loyalty-admin-headers.headers.stsPreload=true
      - traefik.http.services.loyalty-admin.loadbalancer.server.port=80
      - traefik.http.services.loyalty-admin.loadbalancer.server.scheme=http
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
      args:
        VITE_BASE_PATH: ${CUSTOMER_BASE_PATH:-/customer/}
    expose:
      - "80"
    networks:
      - default
      - traefik-hrm
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-hrm
      - traefik.http.routers.loyalty-customer.rule=Host(`loyalty.trunglocxoay.store`)
      - traefik.http.routers.loyalty-customer.entrypoints=websecure
      - traefik.http.routers.loyalty-customer.tls=true
      - traefik.http.routers.loyalty-customer.tls.certresolver=le
      - traefik.http.routers.loyalty-customer.middlewares=loyalty-customer-headers@docker
      - traefik.http.middlewares.loyalty-customer-headers.headers.stsSeconds=315360000
      - traefik.http.middlewares.loyalty-customer-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.loyalty-customer-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.loyalty-customer-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.loyalty-customer-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.loyalty-customer-headers.headers.stsPreload=true
      - traefik.http.services.loyalty-customer.loadbalancer.server.port=80
      - traefik.http.services.loyalty-customer.loadbalancer.server.scheme=http
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  default: {}
  traefik-hrm:
    external: true
